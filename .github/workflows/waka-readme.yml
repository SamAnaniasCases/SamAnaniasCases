name: WakaTime Grind Schedule

on:
  schedule:
    - cron: '0 0 * * *' # runs daily at midnight UTC
  workflow_dispatch: # allows manual trigger

permissions:
  contents: write

jobs:
  update-waka-stats:
    name: Update Grind Schedule
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Update WakaTime Stats
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_OS: "True"
          SHOW_PROJECTS: "True"
          SHOW_EDITORS: "True"
          SHOW_TIMEZONE: "True"
          SHOW_COMMIT: "True"
          SHOW_LANGUAGE: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_SHORT_INFO: "False"
          SHOW_PROFILE_VIEWS: "False"
          COMMIT_BY_ME: "True"
          LOCALE: "en"
          COMMIT_MESSAGE: "⏱️ Update grind schedule stats"
          SHOW_UPDATED_DATE: "False"

      - name: Pull Latest Changes
        run: git pull origin main || git pull origin master

      - name: Transform to RPG Theme
        run: node scripts/rpg-transform-waka.js

      - name: Commit RPG Transformation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "🎮 Apply RPG theme to grind schedule"
          git push
