name: Update README Activity

on:
  schedule:
    - cron: '*/30 * * * *' # runs every 30 minutes
  workflow_dispatch: # allows manual run from GitHub Actions tab

permissions:
  contents: write # required to commit and push changes to README

jobs:
  update-readme:
    name: Update Profile Activity
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # ensures git push works after checkout

      - name: Update Currently Building
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-currently-building.js

      - name: Commit Currently Building
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "⚡ Update currently building in README"
          git push

      - name: Update GitHub Activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          GH_USERNAME: "SamAnaniasCases"
          COMMIT_MSG: "⚡ Update recent activity in biography README"
          MAX_LINES: 5
