<svg xmlns="http://www.w3.org/2000/svg" width="420" height="210" viewBox="0 0 420 210">
  <defs>
    <!-- Diagonal stripe patterns -->
    <pattern id="stripeExp" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="6" height="10" fill="#FFD700" />
      <rect x="6" width="4" height="10" fill="#FFEC80" opacity="0.5" />
    </pattern>
    <pattern id="stripeHP" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="6" height="10" fill="#00CC7A" />
      <rect x="6" width="4" height="10" fill="#66FFBB" opacity="0.4" />
    </pattern>
    <pattern id="stripeMP" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="6" height="10" fill="#7B68EE" />
      <rect x="6" width="4" height="10" fill="#B0A0FF" opacity="0.4" />
    </pattern>
  </defs>

  <!-- ═══ LVL BADGE ═══ -->
  <rect x="0" y="0" width="80" height="30" rx="8" fill="#21262D" stroke="#FFD700" stroke-width="1.5" />
  <text x="40" y="20" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="15" fill="#FFD700">LVL 3</text>
  <text x="92" y="20" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="13" fill="#8B949E">Apprentice Coder</text>

  <!-- ═══ EXP BAR ═══ -->
  <text x="0" y="56" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14" fill="#C9D1D9">⚡ EXP</text>
  <!-- Track -->
  <rect x="0" y="64" width="370" height="24" rx="12" fill="#21262D" stroke="#30363D" stroke-width="1.5" />
  <!-- Fill (45%) -->
  <rect x="1" y="65" width="165.6" height="22" rx="11" fill="url(#stripeExp)" />
  <!-- Percentage -->
  <text x="382" y="81" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#FFD700">45%</text>

  <!-- ═══ HP BAR (Frontend) ═══ -->
  <text x="0" y="116" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14" fill="#C9D1D9">❤️ HP (Frontend)</text>
  <!-- Track -->
  <rect x="0" y="124" width="370" height="24" rx="12" fill="#21262D" stroke="#30363D" stroke-width="1.5" />
  <!-- Fill (55%) -->
  <rect x="1" y="125" width="202.4" height="22" rx="11" fill="url(#stripeHP)" />
  <!-- Percentage -->
  <text x="382" y="141" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#00CC7A">55%</text>

  <!-- ═══ MP BAR (Backend) ═══ -->
  <text x="0" y="176" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14" fill="#C9D1D9">🔮 MP (Backend)</text>
  <!-- Track -->
  <rect x="0" y="184" width="370" height="24" rx="12" fill="#21262D" stroke="#30363D" stroke-width="1.5" />
  <!-- Fill (40%) -->
  <rect x="1" y="185" width="147.2" height="22" rx="11" fill="url(#stripeMP)" />
  <!-- Percentage -->
  <text x="382" y="201" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#7B68EE">40%</text>
</svg>
